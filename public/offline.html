<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmakon — دون اتصال</title><style>body{font:18px system-ui;background:#f4f7f8;color:#133a36;max-width:700px;margin:70px auto;padding:25px}a,button{display:block;margin:15px 0;padding:18px;border:1px solid #d4e4e0;border-radius:14px;background:white;color:#087f70}video{width:100%}</style><img src="/icon-192-v3.png" alt="Farmakon" width="72" height="72" style="border-radius:20px"><h1>Farmakon</h1><p>أنت دون اتصال. هذه الملفات التي حفظتها على هذا الجهاز.</p><div id="list"></div><video id="player" controls hidden></video><a href="/">إعادة الاتصال بالمنصة</a><script>caches.open('farmakon-downloads-v1').then(async c=>{let keys=await c.keys();for(let k of keys){let r=await c.match(k);if(!Number.isFinite(Number(r.headers.get('x-offline-until')))||Number(r.headers.get('x-offline-until'))<=Date.now()){await c.delete(k);continue}let a=document.createElement('button');a.textContent=decodeURIComponent(r.headers.get('x-offline-title')||'ملف');a.onclick=async()=>{r=await c.match(k);if(!r||!Number.isFinite(Number(r.headers.get('x-offline-until')))||Number(r.headers.get('x-offline-until'))<=Date.now()){await c.delete(k);a.remove();document.getElementById('list').append(document.createTextNode('انتهت صلاحية الملف. اتصل بالمنصة لتجديده.'));return}let blob=await r.clone().blob(),url=URL.createObjectURL(blob);if(blob.type.startsWith('video/')){let p=document.getElementById('player');p.hidden=false;p.src=url}else{let link=document.createElement('a');link.href=url;link.download=a.textContent;link.click()}};document.getElementById('list').append(a)}if(!document.querySelector('button'))document.getElementById('list').textContent='لا توجد تنزيلات متاحة، أو انتهت صلاحيتها.'});</script></html>
