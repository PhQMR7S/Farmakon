<style>
:root{--bg:#F4F6FC;--surface:#fff;--text:#0C1233;--muted:#586284;--border:#DDE2F0;--acc:#1578D4;--danger:#B3261E;--ok:#0B7A4B;--field:#F4F6FC;--shadow:0 24px 70px rgba(12,18,51,.14);--warm:linear-gradient(120deg,#FDC23A,#FD8D4B 45%,#FA6956);--cool:linear-gradient(120deg,#2D9DF3,#3FBAFD);--f:'Tajawal','Inter',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060A22;--surface:#0D1336;--text:#EEF2FF;--muted:#9AA5CC;--border:#1E2750;--acc:#3FBAFD;--danger:#FF8A80;--ok:#5FD7A0;--field:#080D2B;--shadow:0 24px 70px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060A22;--surface:#0D1336;--text:#EEF2FF;--muted:#9AA5CC;--border:#1E2750;--acc:#3FBAFD;--danger:#FF8A80;--ok:#5FD7A0;--field:#080D2B;--shadow:0 24px 70px rgba(0,0,0,.55);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.7}
[dir=ltr] body{font-family:'Inter','Tajawal',system-ui,sans-serif;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.brand{position:relative;overflow:hidden;color:#fff;padding:40px 52px;display:flex;flex-direction:column;justify-content:space-between;background:#060A22;--mx:50%;--my:40%;--rx:0deg;--ry:0deg}
.brand::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 500px at 18% 92%,rgba(250,105,86,.25),transparent 65%),radial-gradient(700px 500px at 88% 8%,rgba(45,157,243,.28),transparent 65%),radial-gradient(1.2px 1.2px at 1px 1px,rgba(255,255,255,.09) 100%,transparent 0) 0 0/26px 26px}
.brand::after{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx) var(--my),rgba(255,255,255,.07),transparent 70%);pointer-events:none}
.brand>*{position:relative;z-index:1}
.mark{width:clamp(220px,32vw,400px);aspect-ratio:1;margin:0 auto;position:relative;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s;animation:float 7s ease-in-out infinite}
.mark img{width:100%;height:100%;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%);mask-image:radial-gradient(circle,#000 58%,transparent 72%);filter:saturate(1.1)}
@keyframes float{50%{translate:0 -10px}}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}

.logo small{display:block;font-size:11.5px;font-weight:500;color:#9AA5CC;letter-spacing:.3px;margin-top:-4px}
.hero h1{font-size:clamp(28px,3vw,42px);line-height:1.25;margin:0 0 12px;font-weight:800}
.hero h1 em{font-style:normal;background:var(--warm);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#B4BEE0;max-width:470px}
.feats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.feat{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);font-size:14px;color:#DDE4FF}
.feat .i{width:18px;height:18px}.feat:nth-child(1) .i{color:#FD8D4B}.feat:nth-child(2) .i{color:#FA6956}.feat:nth-child(3) .i{color:#3FBAFD}
.foot{font-size:13px;color:#7C88B5}
.pane{display:grid;place-items:center;padding:28px 20px;position:relative}
.tools{position:absolute;top:18px;inset-inline-end:18px;display:flex;gap:8px}
.tbtn{min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:.2s;font-weight:700;font-size:14px}

  .ddp ul{flex:1;min-height:0}
  .dds-start{font-size:15px}
}
@media(max-width:390px){.dds-start{font-size:14px}}


/* Email confirmation - original Farmakon colors and fluid motion */
.otp-badge{width:58px;height:58px;margin:0 0 16px;display:grid;place-items:center;border-radius:18px;background:color-mix(in srgb,var(--acc) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 26%,var(--border));color:var(--acc);box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 12%,transparent)}
.otp-badge .i{width:28px;height:28px}
.otp-email{background:var(--field);border:1px solid var(--border);border-radius:12px;padding:10px 14px;text-align:center;direction:ltr;unicode-bidi:plaintext;font-family:Inter,Tajawal,sans-serif;font-size:13px;overflow-wrap:anywhere;color:var(--text);margin:0 0 18px}
.otp-wrapper{position:relative;display:block;min-height:62px;margin:18px 0 10px;cursor:text;touch-action:manipulation}
.otp-slots{direction:ltr;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.otp-slot{min-width:0;width:100%;height:58px;display:grid;place-items:center;border:1.5px solid var(--border);border-radius:13px;background:var(--field);font:700 clamp(18px,4vw,25px)/1 Inter,system-ui,sans-serif;color:var(--text);transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.otp-slot.filled{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 58%,var(--border))}
.otp-wrapper:focus-within .otp-slot.active{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent);transform:translateY(-2px)}
#otp-code{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:.01;border:0;background:transparent;cursor:text;color:transparent;caret-color:transparent;font-size:20px;-webkit-text-security:disc}
.otp-helper{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;margin:0 0 16px}
.otp-helper .i{width:16px;height:16px}
.otp-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px;font-size:13px}
.otp-actions .lnk{font-size:13px}
.otp-hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.otp-expired{color:var(--danger)}
@media(max-width:360px){.otp-slots{gap:5px}.otp-slot{height:49px;border-radius:10px}.otp-actions{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.otp-slot{transition:none!important;transform:none!important}}

  const btn=el.querySelector('.ddb'),pop=el.querySelector('.ddp'),ul=el.querySelector('ul'),inp=el.querySelector('input'),searchStart=el.querySelector('.dds-start'),dv=el.querySelector('.ddv'),grab=el.querySelector('.sheet-grab');

    if(o.custom&&d.q.trim()&&!o.items.some(it=>norm(it.ar)==q||norm(it.en)==q))l=l.concat({v:d.q.trim().slice(0,120),custom:true});
    d.list=l;if(d.act>=l.length)d.act=Math.max(0,l.length-1);

    const a=ul.querySelector('.act');if(a){ul.setAttribute('aria-activedescendant',a.id);a.scrollIntoView({block:'nearest'})}

  Object.values(DD).forEach(x=>x.refresh());renderStep();renderStr();if(typeof otpPaint==='function')otpPaint();if(typeof otpTick==='function')otpTick();st('q7l',L)}

$$('.js-theme').forEach(b=>b.onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';st('farmakon-auth-preview-theme',r.dataset.theme)});
const savedTheme=st('farmakon-auth-preview-theme');if(['light','dark'].includes(savedTheme))document.documentElement.dataset.theme=savedTheme;


/* ---------- validation ---------- */
const rules={lemail:v=>!v.trim()?'eReq':em(v)?'':'eBad',remail:v=>!v.trim()?'eReq':em(v)?'':'eBad',email:v=>!v.trim()?'eReq':em(v)?'':'eBad',
 lpass:v=>v?'':'pReq',pass:v=>!v?'pReq':v.length<10?'pShort':!(/\p{L}/u.test(v)&&/\d/.test(v))?'pWeak':'',
 name:v=>v.trim().length<2?'nReq':'',stage:v=>v?'':'sReq',uni:v=>v?'':'uReq',gov:v=>v?'':'gReq'};
const val=n=>DD[n]?DD[n].val():$('#'+n).value;
function setE(n,k){const w=$('#w-'+n)||$('#dd-'+n);if(w)w.classList.toggle('bad',!!k);const e=$('#e-'+n);if(e)e.textContent=k?T[L][k]:'';const i=$('#'+n);if(i&&i.tagName=='INPUT')i.setAttribute('aria-invalid',!!k)}
function check(n){const k=rules[n](val(n));setE(n,k);return !k}
function validate(list){let first=null;list.forEach(n=>{if(!check(n)&&!first)first=n});if(first){const f=DD[first]?DD[first].el.querySelector('.ddb'):$('#'+first);f&&f.focus()}return !first}
$$('input[data-v]').forEach(i=>{
  i.addEventListener('blur',()=>{if(i.type=='email')i.value=i.value.trim().toLowerCase();if(i.id=='name')i.value=i.value.replace(/\s+/g,' ').trim();if(i.value||i.dataset.t)check(i.id);i.dataset.t=1});
  i.addEventListener('input',()=>{if(i.dataset.t)check(i.id)});
  if(i.dataset.caps!==undefined){const c=e=>{const on=e.getModifierState&&e.getModifierState('CapsLock');$('#caps-'+i.id).hidden=!on};i.addEventListener('keydown',c);i.addEventListener('keyup',c);i.addEventListener('blur',()=>$('#caps-'+i.id).hidden=true)}});
$$('[data-eye]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye),s=i.type=='password';i.type=s?'text':'password';b.querySelector('use').setAttribute('href',s?'#eyeoff':'#eye')});
$('#pass').addEventListener('input',e=>{const v=e.target.value;let s=0;if(v){if(v.length>=10)s++;if(/\p{Ll}/u.test(v)&&/\p{Lu}/u.test(v))s++;if(/\d/.test(v))s++;if(/[^\p{L}\d]/u.test(v))s++}sv=s;
  $('#rq1').classList.toggle('ok',v.length>=10);$('#rq2').classList.toggle('ok',/\p{L}/u.test(v)&&/\d/.test(v));renderStr()});
function renderStr(){const c=['#FA6956','#FD8D4B','#3FBAFD','#2D9DF3'];$$('#meter span').forEach((x,i)=>x.style.background=i<sv?c[sv-1]:'');$('#strL').textContent=sv?T[L].strW+T[L].str[sv-1]:''}

/* ---------- register steps ---------- */
function renderStep(){$('#stepL').textContent=T[L].stepOf.replace('{n}',step).replace('{t}',T[L]['st'+step]);$('#sb2').classList.toggle('on',step==2)}
function goStep(n){step=n;$('#s1').hidden=n!=1;$('#s2').hidden=n!=2;renderStep();focusFirst()}
$('#prev').onclick=()=>goStep(1);

/* ---------- auth-only routes: never show a sample dashboard ---------- */
const AUTH=['login','register','reset','verify'];
let cur='login';
function focusFirst(){if(!matchMedia('(hover:hover)').matches)return;const f=document.querySelector('form:not([hidden]) .step:not([hidden]) .f input,form:not([hidden]):not(#vReg) .f input');f&&setTimeout(()=>f.focus(),60)}
function feedback(message='',isError=false){
 const ok=$('#serverMessage'),bad=$('#serverError');
 ok.hidden=true;bad.hidden=true;ok.textContent='';bad.textContent='';
 if(!message)return;
 const el=isError?bad:ok;el.textContent=message;el.hidden=false;
 el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function route(first){
 let h=location.hash.slice(1);
 if(!AUTH.includes(h))h='login';
 if(h!==location.hash.slice(1))history.replaceState(null,'','#'+h);
 if(h!==cur)feedback();cur=h;
 $('#vLogin').hidden=h!=='login';$('#vReg').hidden=h!=='register';$('#vReset').hidden=h!=='reset';$('#vOtp').hidden=h!=='verify';
 $('#seg').style.display=(h==='reset'||h==='verify')?'none':'';$('#seg').classList.toggle('r',h==='register');
 $('#t-login').setAttribute('aria-selected',String(h==='login'));
 $('#t-reg').setAttribute('aria-selected',String(h==='register'));
 if(h!=='register')step=1;if(h==='register')goStep(step);
 if(h!=='reset')$('#rok').hidden=true;
 if(h==='verify'){otpPaint();otpTick()}if(!first&&h!=='register'&&h!=='verify')focusFirst();
}
window.addEventListener('hashchange',()=>{Object.values(DD).forEach(d=>d.close());route()});
$('#t-login').onclick=()=>location.hash='login';$('#t-reg').onclick=()=>location.hash='register';
$('#goReset').onclick=()=>location.hash='reset';$('#backReset').onclick=()=>location.hash='login';
$('#seg').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){location.hash=cur==='login'?'register':'login'}});
/* ---------- real, same-origin Supabase authentication ---------- */
function busy(f,on){const b=f.querySelector('button[type=submit]:not([hidden])');const k=f.id==='vLogin'?'loginBtn':f.id==='vOtp'?'otpConfirm':f.id==='vReset'?'send':step===1&&f.id==='vReg'?'next':'regBtn';
 f.querySelectorAll('button[type=submit]').forEach(x=>x.disabled=on);if(!b)return;
 b.innerHTML=on?'<span class="spin"></span>':`<span>${T[L][k]}</span><svg class="i go"><use href="#arrow"/></svg>`}
async function sendAuth(payload){
 const response=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify(payload)});
 let data={};try{data=await response.json()}catch{}
 if(!response.ok)throw Error(data.error||T[L].requestError);
 return data;
}
$('#vLogin').onsubmit=async e=>{
 e.preventDefault();if(!validate(['lemail','lpass']))return;
 const f=e.currentTarget;feedback();busy(f,true);
 try{
  await sendAuth({action:'login',email:$('#lemail').value.trim().toLowerCase(),password:$('#lpass').value});
  // The real and existing Farmakon dashboard is the / route.
  window.location.assign('/');
 }catch(err){feedback(err.message||T[L].requestError,true);busy(f,false)}
};
$('#vReg').onsubmit=async e=>{
 e.preventDefault();
 if(step===1){if(validate(['name','email','pass']))goStep(2);return}
 if(!validate(['stage','uni','gov']))return;
 const f=e.currentTarget;feedback();busy(f,true);
 try{
  await sendAuth({action:'signup',name:$('#name').value.trim(),email:$('#email').value.trim().toLowerCase(),password:$('#pass').value,
   stage:DD.stage.val(),university:DD.uni.sel?.custom?DD.uni.val():DD.uni.sel?.ar||DD.uni.val(),
   governorate:DD.gov.sel?.custom?DD.gov.val():DD.gov.sel?.ar||DD.gov.val()});
  otpEmail=$('#email').value.trim().toLowerCase();otpRequestedAt=Date.now();otpNextResend=otpRequestedAt+60000;
  otpStorage.setItem('farmakon-pending-email',otpEmail);
  otpStorage.setItem('farmakon-otp-start',String(otpRequestedAt));
  otpStorage.setItem('farmakon-otp-resend',String(otpNextResend));
  $('#otp-code').value='';busy(f,false);
  location.hash='verify';otpPaint();otpTick();feedback(T[L].signupComplete,false);
 }catch(err){feedback(err.message||T[L].requestError,true);busy(f,false)}
};

/* OTP confirmation - real Supabase server verification; no fake dashboard */
const otpStorage={getItem(k){try{return window.sessionStorage.getItem(k)}catch{return null}},setItem(k,v){try{window.sessionStorage.setItem(k,v)}catch{}},removeItem(k){try{window.sessionStorage.removeItem(k)}catch{}}};
let otpEmail=otpStorage.getItem('farmakon-pending-email')||'';
let otpRequestedAt=Number(otpStorage.getItem('farmakon-otp-start'))||0;
let otpNextResend=Number(otpStorage.getItem('farmakon-otp-resend'))||0;
let otpVerifying=false;
const otpSecondsLeft=()=>Math.max(0,Math.ceil((otpRequestedAt+1800000-Date.now())/1000));
function digitsOnly(s){return String(s).replace(/[٠-٩]/g,ch=>String(ch.charCodeAt(0)-0x660)).replace(/[۰-۹]/g,ch=>String(ch.charCodeAt(0)-0x6f0)).replace(/\D/g,'').slice(0,6)}
function otpPaint(){
 const input=$('#otp-code');if(!input)return;
 input.setAttribute('aria-label',L==='ar'?'رمز التحقق المكون من ستة أرقام':'Six-digit verification code');
 const v=digitsOnly(input.value);if(input.value!==v)input.value=v;
 $$('#vOtp .otp-slot').forEach((n,i)=>{n.textContent=v[i]||'·';n.classList.toggle('filled',!!v[i]);n.classList.toggle('active',i===Math.min(v.length,5))});
 $('#otp-submit').disabled=v.length!==6||otpVerifying||!otpSecondsLeft()||!otpEmail;
 const masked=otpEmail.replace(/^(.{1,2})(.*)(@.*)$/,(_,a,b,c)=>a+'•'.repeat(Math.min(6,b.length))+c);
 $('#otp-email').textContent=masked||T[L].otpMissing;
}
function otpTick(){
 const o=$('#otp-countdown');if(!o)return;
 const left=otpSecondsLeft(),m=String(Math.floor(left/60)).padStart(2,'0'),sec=String(left%60).padStart(2,'0');
 o.textContent=left?`${T[L].otpExpiry} ${m}:${sec}`:T[L].otpTimeout;
 o.classList.toggle('otp-expired',!left);
 const wait=Math.max(0,Math.ceil((otpNextResend-Date.now())/1000));
 $('#otp-resend').disabled=wait>0||otpVerifying||!otpEmail;
 $('#otp-resend').textContent=wait?`${T[L].otpWait} ${wait}s`:T[L].otpResend;
 otpPaint();
}
$('#otp-code').addEventListener('input',()=>{otpPaint();if($('#otp-code').value.length===6 && !otpVerifying && otpSecondsLeft() && otpEmail)$('#vOtp').requestSubmit()});
$('#vOtp').addEventListener('submit',async e=>{
 e.preventDefault();if(otpVerifying)return;
 const token=digitsOnly($('#otp-code').value);
 if(!otpEmail){feedback(T[L].otpMissing,true);return}
 if(token.length!==6){feedback(T[L].otpInvalid,true);return}
 if(!otpSecondsLeft()){feedback(T[L].otpTimeout,true);return}
 otpVerifying=true;busy($('#vOtp'),true);feedback();
 try{
  await sendAuth({action:'verifySignup',email:otpEmail,token});
  otpStorage.removeItem('farmakon-pending-email');otpStorage.removeItem('farmakon-otp-start');otpStorage.removeItem('farmakon-otp-resend');
  window.location.assign('/');
 }catch(err){feedback(T[L].otpError,true);otpVerifying=false;busy($('#vOtp'),false);otpPaint()}
});
$('#otp-resend').addEventListener('click',async()=>{
 if(!otpEmail||otpVerifying||Date.now()<otpNextResend)return;
 const btn=$('#otp-resend');btn.disabled=true;feedback();
 try{
  await sendAuth({action:'resendSignup',email:otpEmail});
  otpRequestedAt=Date.now();otpNextResend=otpRequestedAt+60000;
  otpStorage.setItem('farmakon-otp-start',String(otpRequestedAt));
  otpStorage.setItem('farmakon-otp-resend',String(otpNextResend));
  $('#otp-code').value='';otpTick();feedback(T[L].otpResent,false);
 }catch(err){feedback(err.message||T[L].requestError,true)}finally{otpTick()}
});
$('#otp-change').addEventListener('click',()=>{location.hash='register';goStep(1);$('#email').focus({preventScroll:true})});
$('#otp-login').addEventListener('click',()=>{if(otpEmail)$('#lemail').value=otpEmail;location.hash='login'});
setInterval(()=>{if(cur==='verify')otpTick()},1000);

$('#vReset').onsubmit=async e=>{
 e.preventDefault();if(!validate(['remail']))return;
 const f=e.currentTarget;feedback();busy(f,true);
 try{await sendAuth({action:'forgot',email:$('#remail').value.trim().toLowerCase()});$('#rok').hidden=false}
 catch(err){feedback(err.message||T[L].requestError,true)}finally{busy(f,false)}
};
$('#brand').addEventListener('pointermove',e=>{const b=e.currentTarget,r=b.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;b.style.setProperty('--mx',x+'px');b.style.setProperty('--my',y+'px');b.style.setProperty('--ry',((x/r.width-.5)*14)+'deg');b.style.setProperty('--rx',(-(y/r.height-.5)*14)+'deg')});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.tbtn,.ddb');if(b)b.classList.add('is-pressing')});
for(const event of ['pointerup','pointercancel','pointerleave'])document.addEventListener(event,e=>{document.querySelectorAll('.is-pressing').forEach(n=>n.classList.remove('is-pressing'))});
window.addEventListener('resize',()=>{if(!isSmallScreen())Object.values(DD).forEach(d=>d.close())});
apply();route(true);
</script>
