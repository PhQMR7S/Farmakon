name: Farmakon quality checks
on:
  pull_request:
    branches: [main, feat/farmakon-v2-p0-privacy, audit/f00-regression-2026-10-26]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmakon-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      local_only: ${{ steps.scope.outputs.local_only }}
      p02_only: ${{ steps.scope.outputs.p02_only }}
      p03_only: ${{ steps.scope.outputs.p03_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          LOCAL_MODE: ${{ github.repository == 'PhQMR7S/Farmakon' && github.event.pull_request.head.ref == 'audit/f00-regression-2026-10-26' }}
          P02_MODE: ${{ github.repository == 'PhQMR7S/Farmakon' && github.event.pull_request.head.ref == 'codex/farmakon-p0-critical-fixes-2026-10-28' }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          paths=subprocess.check_output(['git','diff','--name-only','0bc525e268a1fc330d531ccbfefc8c28decd5749','HEAD'],text=True).splitlines()
          allowed=lambda p: p.startswith('tests/local-supabase/') or p in ('.github/workflows/local-supabase.yml','.github/workflows/quality.yml','.github/workflows/local-registry-diagnostic.yml','docs/FARMAKON-F00-LOCAL-SUPABASE-VALIDATION-REPORT.md','docs/FARMAKON-F00-LOCAL-SUPABASE-UNBLOCK-REPORT.md','docs/evidence/F00.10.1-RELIABILITY.json','docs/evidence/F00.10.1-REGISTRY.json')
          isolated=os.environ.get('LOCAL_MODE')=='true' and bool(paths) and all(allowed(p) for p in paths)
          # F00.10.2 baseline/browser passed at this checkpoint; its load FAILED.
          # A follow-up that only extends this diagnostic/docs must not retry that
          # failed load unchanged. This does NOT clear or reclassify its failure.
          delta=subprocess.check_output(['git','diff','--name-only','a8c2c37636a5e87b38338b185c6aa9c0b1e082ad','HEAD'],text=True).splitlines()
          followup_paths={'tests/performance/postgres-load.mjs','tests/serialization-root-cause.mjs','tests/helpers/pg-trace.mjs','tests/helpers/postgres.mjs','.github/workflows/serialization-trace.yml','docs/FARMAKON-F00-POSTGRES-SERIALIZATION-ROOT-CAUSE-REPORT.md','docs/evidence/F00.10.3-COMPONENT-TRACE.json','docs/evidence/F00.10.3-RESULTS.json','tests/exam-concurrency.mjs','.github/workflows/exam-concurrency.yml','.github/workflows/quality.yml','docs/FARMAKON-F00-EXAM-CONCURRENCY-RELIABILITY-REPORT.md','docs/evidence/F00.10.2-EXAM-CONCURRENCY.json'}
          followup=os.environ.get('LOCAL_MODE')=='true' and bool(delta) and all(p in followup_paths for p in delta)
          isolated=isolated or followup
          p02_delta=subprocess.check_output(['git','diff','--name-only','00e7cbaef57631d2fc551d24fdd40c635d901a2d','HEAD'],text=True).splitlines()
          p02_paths={'tests/ssi-architecture-p02.mjs','tests/ssi-legacy-p02.mjs','tests/ssi-runtime-p02.mjs','tests/ssi-roles-p02.mjs','docs/evidence/P0.2-SSI-ARCHITECTURE.json','docs/evidence/P0.2-SSI-LEGACY.json','docs/FARMAKON-P0-SSI-ARCHITECTURE-VALIDATION-REPORT.md','.github/workflows/ssi-p02.yml','.github/workflows/quality.yml'}
          p02=os.environ.get('P02_MODE')=='true' and bool(p02_delta) and all(p in p02_paths for p in p02_delta)
          p03_delta=subprocess.check_output(['git','diff','--name-only','f9f8d1c848fc1a95c07cfe9d7e541596c72aae58','HEAD'],text=True).splitlines()
          p03_paths={'tests/atomic-mirror-p05.py','tests/fixtures/atomic-mirror-p05.sql','.github/workflows/atomic-mirror-p05.yml','docs/evidence/P0.5-ATOMIC-MIRROR.json','docs/FARMAKON-P0-ATOMIC-MIRROR-RESULTS.md','docs/FARMAKON-P0-SSI-WRITER-COVERAGE-REVIEW.md','tests/ssi-migration-p03.mjs','tests/ssi-runtime-p03.mjs','tests/ssi-privacy-p03.mjs','tests/ssi-backup-p03.mjs','docs/evidence/P0.3-SSI-MIGRATION.json','docs/FARMAKON-P0-SSI-MIGRATION-SAFETY-REPORT.md','.github/workflows/ssi-p03.yml','.github/workflows/quality.yml'}
          p03=os.environ.get('P02_MODE')=='true' and bool(p03_delta) and all(p in p03_paths for p in p03_delta)
          isolated=isolated or p02 or p03
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('local_only='+str(isolated).lower()+'\np02_only='+str(p02).lower()+'\np03_only='+str(p03).lower()+'\n')
          print('Only reviewed isolated tooling changes may skip unchanged regression. F00.10.2 load failure remains OPEN; follow-up does not rerun or clear it.')
          PY

  p02_existing_load_gate:
    needs: scope
    if: needs.scope.outputs.p02_only == 'true' || needs.scope.outputs.p03_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep previously failed SSI load gate visible
        run: |
          echo 'FAILED: prior 10 VU load produced startExam HTTP 503 / SQLSTATE 40001; P0.2 is a test-only prototype and does not repair runtime.'
          exit 1

  baseline:
    needs: scope
    if: needs.scope.outputs.local_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Backend regression smoke (SQLite test adapter)
        run: |
          node tests/backend-smoke.mjs
          node tests/subscriptions.mjs
          node tests/validation-contract.mjs
      - name: Auth contract smoke (no live provider)
        run: |
          node tests/auth-smoke.mjs
          node tests/callback-smoke.mjs
          node tests/privacy-smoke.mjs
          node tests/storage-reliability.mjs
      - name: Bounded request security checks
        run: |
          node tests/http-smoke.mjs
          node tests/database-reliability.mjs
          node tests/database-rollback.mjs
      - name: Preview isolation fail-closed checks
        run: |
          node tests/preview-isolation-smoke.mjs
          node --check tests/live/staging-auth.mjs
          node --check tests/live/entitlements.mjs
          node --check tests/live/preview-security.mjs
          node --check tests/live/preview-signed-url.mjs
          node --check tests/live/exam-preview.mjs
      - name: PWA regression smoke
        run: node tests/pwa-smoke.cjs
      - name: Production compile
        run: npm run build

  postgres:
    needs: scope
    if: needs.scope.outputs.local_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: farmakon_v2_test
          POSTGRES_USER: farmakon_test
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farmakon_test -d farmakon_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          FARMAKON_TEST_DATABASE_URL: postgresql://farmakon_test:fixture-only-password@127.0.0.1:5432/farmakon_v2_test
      - name: Controlled exam concurrency diagnostic (three coordinated rounds)
        run: node tests/exam-concurrency.mjs
        env:
          FARMAKON_TEST_DATABASE_URL: postgresql://farmakon_test:fixture-only-password@127.0.0.1:5432/farmakon_v2_test
      - name: Atomic subscription renewal and coordinated code claims
        run: node tests/subscriptions.mjs
        env:
          FARMAKON_TEST_DATABASE_URL: postgresql://farmakon_test:fixture-only-password@127.0.0.1:5432/farmakon_v2_test
      - name: Synthetic account deletion PostgreSQL lifecycle
        run: node tests/privacy-postgres.mjs
        env:
          FARMAKON_TEST_DATABASE_URL: postgresql://farmakon_test:fixture-only-password@127.0.0.1:5432/farmakon_v2_test
      - name: Storage RLS with real PostgreSQL roles
        run: node tests/storage-policy-smoke.mjs
        env:
          FARMAKON_TEST_DATABASE_URL: postgresql://farmakon_test:fixture-only-password@127.0.0.1:5432/farmakon_v2_test
      - name: Synthetic PostgreSQL backup/restore drill
        run: |
          bash tests/backup-restore.sh
          node tests/recovery-dr.mjs
        env:
          FARMAKON_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - name: Isolated performance baseline and bounded 1-5-10-25 VU load
        if: github.event.pull_request.head.ref != 'codex/farmakon-p0-critical-fixes-2026-10-28'
        run: node tests/performance/postgres-load.mjs
        env:
          FARMAKON_TEST_DATABASE_URL: postgresql://farmakon_test:fixture-only-password@127.0.0.1:5432/farmakon_v2_test
      - name: Existing load gate remains failed pending SSI fix
        if: github.event.pull_request.head.ref == 'codex/farmakon-p0-critical-fixes-2026-10-28'
        run: |
          echo 'BLOCKED: isolated load failed at 10 VU (startExam 503 / SQLSTATE 40001); no unchanged rerun or acceptance threshold change.'
          exit 1

  browser:
    needs: scope
    if: needs.scope.outputs.local_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Local build performance timings (fixture API, bounded)
        run: node tests/performance/web-timings.mjs
      - name: Synthetic deletion browser lifecycle (mock transport)
        run: node tests/privacy-browser.mjs

