name: Farmakon P0.5 atomic database mirroring
on:
  push:
    branches: [codex/farmakon-p0-critical-fixes-2026-10-28]
    paths: [tests/atomic-mirror-p05.py, tests/fixtures/atomic-mirror-p05.sql, .github/workflows/atomic-mirror-p05.yml]
permissions:
  contents: read
jobs:
  mirror:
    if: github.repository == 'PhQMR7S/Farmakon'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: farmakon_v2_test
          POSTGRES_USER: farmakon_test
          POSTGRES_PASSWORD: fixture-only-password
        options: >-
          --health-cmd "pg_isready -U farmakon_test -d farmakon_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test legacy login writes, security boundary and atomic rollback
        run: python3 tests/atomic-mirror-p05.py
        env:
          FARMAKON_P05_DISPOSABLE: 'true'
          FARMAKON_P05_CONTAINER: ${{ job.services.postgres.id }}
      - name: Evidence
        if: always()
        run: cat docs/evidence/P0.5-ATOMIC-MIRROR.json
